services:
  postgres:
    build: ./extension
    ports: ["127.0.0.1:54329:5432"]
    environment:
      POSTGRES_DB: jev_playground
      POSTGRES_USER: jev
      POSTGRES_PASSWORD: local-development-only
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    volumes:
      - jev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jev -d jev_playground"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  jev-data:
